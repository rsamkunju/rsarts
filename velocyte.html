        </div>
        <div class="grid-item small-bottom" onclick="openLightbox(this)">
            <img src="images/VEL011BACK.jpg" class="img-primary" alt="">
        </div>
    </div>
</section>

        <section class="info-section">

                <div class="ember-desc card">
                    <h2>THE GOAL</h2>

</section

        <section class="concept-section">

    <footer class="brutalist-footer">
        <!-- Footer content... -->
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <span class="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="Full View">
    </div>

    <!-- Lightbox Script -->
    <script>
        function openLightbox(element) {
            const primaryImg = element.querySelector('.img-primary');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            if (primaryImg) {
                lightboxImg.src = primaryImg.src;
                lightbox.style.display = 'flex';
            }
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") document.getElementById('lightbox').style.display = 'none';
        });
    </script>
</body>
